# Ablation registry.
#
# Each entry is selected with `python run.py --config <cfg> --run <key>`.
# Keys are descriptive; the legacy short codenames (B0, B5a, ...) remain valid
# aliases. `canonical_run_id` is the stable identity written into
# logging.run_id (WandB run name/group/tags, checkpoint dir, analysis-CSV join
# key) regardless of which alias is passed — so renaming a key never orphans an
# existing result. `parent:` resolves recursively (parent overrides applied
# first, child last); aliases are resolved on parent references too.

runs:
  # ===========================================================================
  # Baseline & projection capacity
  # ===========================================================================
  base_min:
    canonical_run_id: B0
    aliases: [B0]
    description: >-
      Alias for unfreeze_4. Kept so existing child entries (parent: base_min)
      and historical run names (B0_*_s{seed}) remain valid after the B0 ->
      B0_uf4 rename. Loads identically to unfreeze_4.
    parent: unfreeze_4
    overrides: {}

  unfreeze_4:
    canonical_run_id: B0_uf4
    aliases: [B0_uf4]
    description: >-
      Minimal fine-tune baseline. Tests whether training only the CLIP
      projection layers with vanilla InfoNCE (no augmentation, no intra-modal
      contrast) is sufficient for competitive retrieval. Establishes the
      performance floor for all ablations.
    overrides:
      logging.eval_epoch_zero: true
      loss.intra_img_weight: 0
      loss.intra_txt_weight: 0
      augment.k_photometric_augs: 0

  proj1024:
    canonical_run_id: B0_proj1024
    aliases: [B0_proj1024]
    description: >-
      B0 with an additional learned projection from CLIP's native 768-d joint
      space into 1024 dimensions for both image and text embeddings. Tests
      whether a wider retrieval embedding improves the minimal fine-tune
      baseline.
    parent: base_min
    overrides:
      model.embed_dim: 1024

  # ===========================================================================
  # Vision-backbone unfreezing sweep
  # ===========================================================================
  proj_only:
    canonical_run_id: B0_projonly
    aliases: [B0_projonly]
    description: >-
      B0 projection-only variant. Keeps the minimal InfoNCE/no-augmentation
      regime but freezes the vision transformer blocks entirely, training only
      CLIP projection layers and logit_scale. Complements the lower-depth
      unfreezing sweep where B0 itself is the 4-layer point.
    parent: base_min
    overrides:
      model.unfreeze_vision_layers: 0

  unfreeze_1:
    canonical_run_id: B0_uf1
    aliases: [B0_uf1]
    description: >-
      B0 + unfreeze last 1 vision block. Lower-depth unfreezing sweep point
      between projection-only and the default B0 4-layer setting.
    parent: base_min
    overrides:
      model.unfreeze_vision_layers: 1

  unfreeze_2:
    canonical_run_id: B0_uf2
    aliases: [B0_uf2]
    description: >-
      B0 + unfreeze last 2 vision blocks. Lower-depth unfreezing sweep point
      between projection-only and the default B0 4-layer setting.
    parent: base_min
    overrides:
      model.unfreeze_vision_layers: 2

  unfreeze_3:
    canonical_run_id: B0_uf3
    aliases: [B0_uf3]
    description: >-
      B0 + unfreeze last 3 vision blocks. Lower-depth unfreezing sweep point
      immediately below the default B0 4-layer setting.
    parent: base_min
    overrides:
      model.unfreeze_vision_layers: 3

  unfreeze_5:
    canonical_run_id: B0_uf5
    aliases: [B0_uf5]
    description: >-
      B0 + unfreeze last 5 vision blocks. Tests whether deeper backbone
      fine-tuning improves retrieval when augmentation and intra-modal
      contrast are disabled.
    parent: base_min
    overrides:
      model.unfreeze_vision_layers: 5

  unfreeze_6:
    canonical_run_id: B0_uf6
    aliases: [B0_uf6]
    description: >-
      B0 + unfreeze last 6 vision blocks. Part of the unfreezing depth
      sweep (unfreeze_5/6/7) to find the optimal number of trainable vision
      blocks under the minimal-augmentation regime.
    parent: base_min
    overrides:
      model.unfreeze_vision_layers: 6

  unfreeze_7:
    canonical_run_id: B0_uf7
    aliases: [B0_uf7]
    description: >-
      B0 + unfreeze last 7 vision blocks. Upper end of the unfreezing
      depth sweep. Tests whether unfreezing more than half the vision
      encoder causes overfitting when augmentation is disabled.
    parent: base_min
    overrides:
      model.unfreeze_vision_layers: 7

  # ===========================================================================
  # Full-featured baseline (intra-modal regularization)
  # ===========================================================================
  intra_reg:
    canonical_run_id: B0plus_fixed
    aliases: [B0plus_fixed, B0plus]
    description: >-
      Full-featured baseline (default config). Adds bipartite crop
      augmentation, LLM-paraphrased captions for text diversity, symmetric
      intra-modal contrast (image-image + text-text), and 4-layer vision
      backbone unfreezing on top of B0. All segment-aware (B5*) ablations
      branch from this configuration.
    overrides: {}  # current config_base.yaml defaults

  # ===========================================================================
  # Loss / hard-negative / auxiliary-task ablations
  # ===========================================================================
  loss_siglip:
    canonical_run_id: B1
    aliases: [B1]
    description: >-
      Loss function ablation: SigLIP vs InfoNCE. Tests whether the
      pairwise sigmoid formulation (SigLIP) improves over the softmax-based
      contrastive objective (InfoNCE). SigLIP removes the implicit
      cross-sample coupling in the softmax denominator, which may improve
      robustness with hard negatives.
    parent: base_min
    overrides:
      loss.type: siglip

  hn_syntactic:
    canonical_run_id: B2
    aliases: [B2]
    description: >-
      Hard negative mining via syntactic perturbation. Tests whether
      NegCLIP-style POS-tag swapping (nouns, verbs, adjectives shuffled
      from the batch pool) forces the model to attend to compositional
      semantics rather than bag-of-words shortcuts. Loss is asymmetric:
      I2T sees both original + negative captions (Nx2N), T2I stays NxN
      because there are no negative images by construction.
    parent: base_min
    overrides:
      loss.hard_negatives: true

  aux_objcls:
    canonical_run_id: B4
    aliases: [B4]
    description: >-
      Multi-task learning with object recognition. Tests whether a BCE
      auxiliary loss over 80 COCO category labels grounds the visual
      encoder to recognize individual objects, improving fine-grained
      retrieval. COCO-only (Flickr30k lacks exhaustive category
      annotations). Mutually exclusive with the segment-aware (B5*) ablations.
    parent: base_min
    overrides:
      loss.cls_weight: 1.0
      loss.cls_num_classes: 80

  # ===========================================================================
  # Segment-aware patch enrichment (per-patch SAM features)
  # ===========================================================================
  seg_spatial:
    canonical_run_id: B5a_seg_spatial
    aliases: [B5a_seg_spatial, B5a]
    description: >-
      Segment-aware patch enrichment: spatial layout encoding. Each patch
      receives a discrete token encoding the spatial position (3x3 grid)
      and relative size (small/medium/large) of its dominant SAM segment.
      Tests whether explicit spatial structure information improves over
      CLIP's implicit positional encoding. 27 foreground bins + 1 bg = 28.
    parent: intra_reg
    overrides:
      model.seg_mode: spatial
      model.seg_vocab_size: 28

  # seg_semantic uses an 81-element vocab: 0 = background, 1..80 = COCO categories.
  # Label sources differ by dataset (see scripts/preprocess/precompute_sam.py):
  #   - COCO:      IoU-match SAM masks against instances_{train,val}2014 (threshold = 0.3).
  #   - Flickr30k: zero-shot CLIP top-1 over the 80 COCO category prompts (prob >= 0.3 else bg);
  #                SAM segments with bbox <4 px on either side are dropped to background.
  seg_semantic:
    canonical_run_id: B5b_seg_semantic
    aliases: [B5b_seg_semantic, B5b]
    description: >-
      Segment-aware patch enrichment: semantic category encoding. Each
      patch receives a learnable embedding for its dominant segment's
      COCO-80 category (IoU-matched on COCO, CLIP zero-shot on Flickr30k).
      Tests whether injecting object-level semantic identity into the
      vision encoder improves compositional understanding.
    parent: intra_reg
    overrides:
      model.seg_mode: semantic
      model.seg_vocab_size: 81

  seg_geom:
    canonical_run_id: B5c_seg_continuous
    aliases: [B5c_seg_continuous, B5c]
    description: >-
      Segment-aware patch enrichment: continuous geometric features. Each
      patch receives a 5-d vector (centroid x/y, area fraction, log aspect
      ratio, patch coverage) projected through a 2-layer MLP. Tests a
      soft, geometric alternative to the discrete seg_spatial/seg_semantic
      approaches — the MLP can learn nonlinear spatial relationships without
      a fixed vocabulary.
    parent: intra_reg
    overrides:
      model.seg_mode: continuous
      model.seg_feature_dim: 5
      model.seg_proj_hidden: 128

  # ===========================================================================
  # Multistream fusion (frozen SAM ViT-B encoder features)
  # ===========================================================================
  sam_gate:
    canonical_run_id: B5d_multistream_gate
    aliases: [B5d_multistream_gate, B5d_gate]
    description: >-
      Multi-stream fusion: frozen SAM ViT-B encoder features fused with CLIP
      CLS token via learned gate. Tests whether dense spatial features from a
      complementary vision model improve retrieval when combined post-encoder.
    parent: intra_reg
    overrides:
      model.seg_mode: multistream
      model.fusion_type: gate
      model.sam_feature_pool_size: 8
      model.sam_feature_dim: 256
      training.fusion_lr: 0.001

  sam_xattn:
    canonical_run_id: B5d_multistream_crossattn
    aliases: [B5d_multistream_crossattn, B5d_xattn]
    description: >-
      Multi-stream fusion: frozen SAM ViT-B encoder features fused via
      cross-attention (CLIP CLS attends to SAM spatial tokens). Tests whether
      attention-based feature selection outperforms gated mixing.
    parent: intra_reg
    overrides:
      model.seg_mode: multistream
      model.fusion_type: cross_attn
      model.sam_feature_pool_size: 8
      model.sam_feature_dim: 256
      model.fusion_num_heads: 8
      training.fusion_lr: 0.001

  sam_concat:
    canonical_run_id: B5d_multistream_concat
    aliases: [B5d_multistream_concat, B5d_concat]
    description: >-
      Multi-stream fusion: frozen SAM ViT-B encoder features fused via
      concatenation + 2-layer MLP. Baseline fusion with no attention mechanism.
    parent: intra_reg
    overrides:
      model.seg_mode: multistream
      model.fusion_type: concat_proj
      model.sam_feature_pool_size: 8
      model.sam_feature_dim: 256
      training.fusion_lr: 0.001

  sam_skip:
    canonical_run_id: B5e_sam_skip
    aliases: [B5e_sam_skip, B5d_skip]
    description: >-
      SAM residual skip connection: CLIP CLS remains the main retrieval
      representation while attending to frozen SAM ViT-B spatial tokens to
      produce a gated residual update. The gate is initialized near zero, so
      training starts close to vanilla CLIP and learns whether SAM should
      contribute region-aware corrections.
    parent: intra_reg
    overrides:
      model.seg_mode: multistream
      model.fusion_type: sam_skip
      model.sam_feature_pool_size: 8
      model.sam_feature_dim: 256
      model.fusion_num_heads: 8
      model.sam_skip_gate_init_bias: -4.0
      training.fusion_lr: 0.001

  # ===========================================================================
  # Diagnostic encoder ablation
  # ===========================================================================
  text_blip:
    canonical_run_id: BLIP_TEXT
    aliases: [BLIP_TEXT]
    description: >-
      Diagnostic encoder ablation: bidirectional text encoder. Replaces CLIP's
      causal-masked text transformer with BLIP's BERT-base encoder
      (Salesforce/blip-itm-base-coco, unimodal mode — cross-attention layers
      skipped) to test whether bidirectional context improves compositional
      understanding. Image encoder (CLIP ViT-L/14@336) unchanged. BLIP text
      encoder is fully frozen; only the text_projection head (Linear 768->768)
      is trainable. max_length raised to 512 (BERT native) to give bidirectional
      context its best shot. Not part of the B0-B5 ladder.
    parent: intra_reg
    overrides:
      model.text_encoder: blip
      model.text_model_name: "Salesforce/blip-itm-base-coco"
      data.max_length: 512
